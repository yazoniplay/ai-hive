<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Hive Connector</title><style>body{font:14px system-ui;max-width:620px;margin:40px auto;padding:0 18px;color:#171916}label{display:block;margin:20px 0 8px;font-weight:650}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:8px}button{margin-top:14px;padding:10px 14px;border:0;border-radius:8px;background:#171916;color:white}p{color:#6b7068;font-size:13px}</style></head><body><h1>AI Hive Connector</h1><p>Enter your actual Render service URL. The default URL is a placeholder until you deploy.</p><label for="relay">Relay URL</label><input id="relay" type="url" placeholder="https://your-service.onrender.com"><button id="save">Save settings</button><p id="status"></p><script>const input=document.querySelector("#relay"),status=document.querySelector("#status");chrome.storage.local.get(["relayUrl"],x=>input.value=x.relayUrl||"https://ai-hive.onrender.com");document.querySelector("#save").onclick=()=>{const v=input.value.trim().replace(/\/$/,"");if(!v.startsWith("https://")){status.textContent="Use an HTTPS URL.";return}chrome.storage.local.set({relayUrl:v},()=>status.textContent="Saved. Reload your AI tabs.")};</script></body></html>
