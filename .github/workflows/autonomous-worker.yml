name: AI Hive autonomous worker

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-hive-autonomous-worker
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check configuration
        id: config
        env:
          DATABASE_URL: \${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: \${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: \${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; echo "Skipping: add DATABASE_URL in repository Actions secrets."; exit 0; fi
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; echo "Skipping: add OPENAI_API_KEY and/or ANTHROPIC_API_KEY in repository Actions secrets."; exit 0; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - name: Run autonomous agent
        if: steps.config.outputs.ready == 'true'
        env:
          DATABASE_URL: \${{ secrets.DATABASE_URL }}
          AI_HIVE_TOKEN_SECRET: \${{ secrets.AI_HIVE_TOKEN_SECRET }}
          OPENAI_API_KEY: \${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: \${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: \${{ github.token }}
          AI_HIVE_MAX_TASKS_PER_RUN: "2"
          AI_HIVE_MAX_TOOL_TURNS: "8"
        run: python agent_worker.py
